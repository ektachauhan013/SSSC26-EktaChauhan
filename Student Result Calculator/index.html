<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Result Calculator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <div class="left-section">

      <p class="tag">
        STUDENT PERFORMANCE SYSTEM
      </p>

      <h1>
        Student Result <br>
        Calculator
      </h1>

      <p class="description">
        Calculate marks, percentage, grades and performance insights instantly with a clean and modern dashboard.
      </p>

      <div class="stats">

        <div class="stat-card">
          <h3>5</h3>
          <p>Subjects</p>
        </div>

        <div class="stat-card">
          <h3>10</h3>
          <p>Highest Grade</p>
        </div>
      </div>
    </div>

    <div class="right-section">
      <div class="form-card">

        <h2>Enter Student Details</h2>

        <div class="input-group">
          <label for="studentName">
            Student Name
          </label>

          <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
          >
        </div>
        <div class="marks-grid">
          <div class="input-group">
            <label for="sub1">Subject 1</label>

            <input
              type="number"
              id="sub1"
              placeholder="0 - 100"
            >
          </div>

          <div class="input-group">
            <label for="sub2">Subject 2</label>

            <input
              type="number"
              id="sub2"
              placeholder="0 - 100"
            >
          </div>

          <div class="input-group">
            <label for="sub3">Subject 3</label>

            <input
              type="number"
              id="sub3"
              placeholder="0 - 100"
            >
          </div>

          <div class="input-group">
            <label for="sub4">Subject 4</label>

            <input
              type="number"
              id="sub4"
              placeholder="0 - 100"
            >
          </div>

          <div class="input-group">
            <label for="sub5">Subject 5</label>

            <input
              type="number"
              id="sub5"
              placeholder="0 - 100"
            >
          </div>

        </div>

        <div class="input-group">

          <label for="day">
            Select Day
          </label>

          <select id="day">

            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>

          </select>

        </div>

        <button onclick="calculateResult()">
          Calculate Result
        </button>

        <div id="result"></div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
